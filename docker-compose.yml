services:
  clipr:
    build: .
    container_name: clipr
    ports:
      - "3000:3000"
    volumes:
      - clipr-data:/data
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      # Modele multimodal du sous-outil "Lecture d'image" de l'Assistant (OCR manuscrit).
      # IMPORTANT : le telecharger une fois dans le conteneur ollama :
      #   docker exec clipr-ollama ollama pull qwen2.5vl:32b
      # Le 32b deborde de la VRAM 12 Go -> il faut ~24 Go de RAM allouee a WSL
      # (.wslconfig: [wsl2] memory=24GB) sinon le runner llama crashe au chargement.
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-qwen2.5vl:32b}
      - JWT_SECRET=${JWT_SECRET}
      - HF_TOKEN=${HF_TOKEN}
      # ─── Validation des inscriptions par email (SMTP temonia.fr:465 SSL) ───
      - SMTP_HOST=${SMTP_HOST:-temonia.fr}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-clipr@temonia.fr}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-clipr@temonia.fr}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-clipr@temonia.fr}
      - PUBLIC_URL=${PUBLIC_URL:-https://clipr-temonia.flavienauvray.me}
      # ─── Connexion par un compte Nextcloud (SSO) ───
      # Facultatif : si ces valeurs sont absentes, Clipr cherche un fichier
      # $DATA_DIR/sso-nextcloud.json (droits 600) ; s'il n'y en a pas non plus,
      # le SSO reste eteint et seule la connexion par mot de passe existe.
      # Le secret ne doit JAMAIS etre ecrit ici en clair : il vient du .env.
      # Procedure cote Nextcloud : deploy/nextcloud/README.md
      - SSO_NC_ISSUER=${SSO_NC_ISSUER:-}
      - SSO_NC_CLIENT_ID=${SSO_NC_CLIENT_ID:-}
      - SSO_NC_CLIENT_SECRET=${SSO_NC_CLIENT_SECRET:-}
      # Adresse publique de Clipr pour l'adresse de retour OIDC. On ne reutilise
      # pas PUBLIC_URL : celui-ci sert aux liens des e-mails et peut pointer une
      # ancienne adresse, ce qui ferait refuser la connexion par le cloud.
      - SSO_NC_URL_PUBLIQUE=${SSO_NC_URL_PUBLIQUE:-}
      - SSO_NC_GROUPE_ACCES=${SSO_NC_GROUPE_ACCES:-Clipr}
      - SSO_NC_GROUPES_ADMIN=${SSO_NC_GROUPES_ADMIN:-admin}
      # ─── Recherche web Assistant : SearXNG (meta-moteur open-source) ───
      # Par defaut : instance publique ethique searx.be (libre, sans tracking)
      # Pour la prod : ajoute un service searxng dans ce compose et mets
      # SEARXNG_URL=http://searxng:8080
      - SEARXNG_URL=${SEARXNG_URL:-https://searx.be}
      # Whitelist des domaines de confiance pour filtrer les resultats (CSV)
      - TRUSTED_WEB_DOMAINS=${TRUSTED_WEB_DOMAINS:-}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    depends_on:
      ollama:
        condition: service_healthy
    restart: always

  ollama:
    image: ollama/ollama
    container_name: clipr-ollama
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: clipr-tunnel
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    depends_on:
      - clipr

  # Caddy : reverse proxy HTTPS (fallback / acces direct LAN).
  # En prod 06/2026, le trafic public passe par Cloudflare Tunnel
  # (clipr-temonia.flavienauvray.me) → cloudflared → clipr:3000 directement,
  # Caddy n'est plus sur le chemin critique mais on le garde pour acces local.
  caddy:
    image: caddy:latest
    container_name: clipr-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - clipr

volumes:
  clipr-data:
  ollama-data:
  caddy-data:
  caddy-config:
